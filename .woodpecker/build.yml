# Bau und Tests (Karte 2096). Laeuft im LAN-Runner, weil maven.plaintext.ch nur dort erreichbar ist.
# Keine Secrets: Lesen aus Reposilite braucht keine Anmeldung.
when:
  - event: pull_request
  - event: push
    branch: main
  - event: manual

steps:
  bauen:
    image: maven:3.10-eclipse-temurin-25
    commands:
      - mvn -B -Dmaven.build.cache.enabled=false clean verify
      - bash -n ci/release.sh

  js-tests:
    # Karte 2413: Textregeln der Editor-Knöpfe (notizen.js), ohne Abhängigkeiten.
    image: node:22-alpine
    commands:
      - node --test src/test/js/notizen.test.js
