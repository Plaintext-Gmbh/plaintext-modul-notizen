# Release per Git-Tag X.Y.Z nach GitHub Packages (plaintext-mvn), Karte 2096.
# Der Tag IST die Version; gepusht hat ihn, wer taggt. Die POM-Version wird nur im
# Arbeitsbaum gesetzt, nie committet (main bleibt auf X.Y.Z-SNAPSHOT).
when:
  - event: tag

steps:
  release:
    image: maven:3.10-eclipse-temurin-25
    environment:
      # server-id `plaintext` (GitHub Packages, distributionManagement im pom).
      MVN_DEPLOY_TOKEN:
        from_secret: mvn_deploy_token
    commands:
      - ci/release.sh
