# Release per Git-Tag X.Y.Z nach Reposilite (Karte 2412, vorher GitHub Packages, Karte 2096).
# Der Tag IST die Version; gepusht hat ihn, wer taggt. Ablauf und Pruefungen: ci/release.sh.
# Secret, NUR fuer das Ereignis tag (kein PR-Lauf sieht es): maven_nas_token (Server-Id plaintext-nas).
when:
  - event: tag

steps:
  release:
    image: maven:3.10-eclipse-temurin-25
    environment:
      MAVEN_NAS_TOKEN:
        from_secret: maven_nas_token
    commands:
      - bash ci/release.sh
