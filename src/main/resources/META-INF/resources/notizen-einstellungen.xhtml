<ui:composition xmlns:h="http://java.sun.com/jsf/html"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                template="/includes/template.xhtml">
    <!-- Karte 2096: welche Speicher-Ablage und welcher Ordner, mit Pruefen-Knopf. Die Ablagen selbst
         richtet ROOT unter Root -> Sidecars ein. -->

    <f:metadata>
        <f:viewAction action="#{notizenEinstellungenBean.laden}"/>
    </f:metadata>

    <ui:define name="title">#{i18n.t('Notizen-Einstellungen')}</ui:define>

    <ui:define name="content">
        <h:outputStylesheet library="notizen" name="notizen.css"/>
        <h:form id="ef">
            <input type="hidden" name="_csrf" value="#{_csrf.token}"/>
            <div class="card notizen-einstellungen">
                <h2>#{i18n.t('Notizen-Einstellungen')}</h2>
                <p>#{i18n.t('Die Notizen liegen in einer Speicher-Ablage von plaintext-root. Ablagen richtet ROOT unter Root – Sidecars ein (Nextcloud, Git oder Lokale Datei).')}</p>
                <h:panelGroup layout="block" styleClass="notizen-hinweis" rendered="#{empty notizenEinstellungenBean.ablagen}">
                    #{i18n.t('Es ist noch keine Speicher-Ablage eingerichtet.')}
                </h:panelGroup>
                <div class="notizen-formular">
                    <p:outputLabel for="ablage" value="#{i18n.t('Speicher-Ablage')}"/>
                    <p:selectOneMenu id="ablage" value="#{notizenEinstellungenBean.ablage}">
                        <f:selectItem itemLabel="–" itemValue="" noSelectionOption="true"/>
                        <f:selectItems value="#{notizenEinstellungenBean.ablagen}"/>
                    </p:selectOneMenu>
                    <p:outputLabel for="ordner" value="#{i18n.t('Ordner in der Ablage')}"/>
                    <p:inputText id="ordner" value="#{notizenEinstellungenBean.ordner}"/>
                </div>
                <div class="notizen-knoepfe">
                    <p:commandButton id="pruefen" value="#{i18n.t('Prüfen')}" icon="pi pi-refresh"
                                     action="#{notizenEinstellungenBean.pruefen}" process="@form" update="@form"/>
                    <p:commandButton id="speichern" value="#{i18n.t('Speichern')}" icon="pi pi-check"
                                     action="#{notizenEinstellungenBean.speichern}" process="@form" update="@form"/>
                </div>
                <h:panelGroup id="ergebnis" layout="block" rendered="#{not empty notizenEinstellungenBean.ergebnis}"
                              styleClass="notizen-meldung #{notizenEinstellungenBean.ergebnis eq 'fehler' ? 'notizen-fehler' : 'notizen-ok'}">
                    <h:outputText rendered="#{notizenEinstellungenBean.ergebnis eq 'geprueft'}"
                                  value="#{i18n.t('Prüfung erfolgreich, die Ablage ist les- und schreibbar:')} #{notizenEinstellungenBean.meldung}"/>
                    <h:outputText rendered="#{notizenEinstellungenBean.ergebnis eq 'gespeichert'}"
                                  value="#{i18n.t('Gespeichert:')} #{notizenEinstellungenBean.meldung}"/>
                    <h:outputText rendered="#{notizenEinstellungenBean.ergebnis eq 'fehler'}"
                                  value="#{i18n.t('Fehler:')} #{notizenEinstellungenBean.meldung}"/>
                </h:panelGroup>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
